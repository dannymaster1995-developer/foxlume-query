name: Release

# Pushing a tag vX.Y.Z (made by scripts/release.sh) builds the app, zips it and publishes a GitHub release whose
# notes are that version's CHANGELOG.md section.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(cat VERSION)" || { echo "tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache DuckDB download
        uses: actions/cache@v4
        with:
          path: .build/duckdb-download
          key: duckdb-${{ hashFiles('scripts/fetch-duckdb.sh') }}

      - name: Fetch DuckDB
        run: scripts/fetch-duckdb.sh

      - name: Test
        # Live database suites skip themselves: no servers run on the CI machine.
        run: |
          source scripts/env.sh
          fqtest

      - name: Build the app
        run: FOXLUME_BUILD="${{ github.run_number }}" scripts/build-app.sh

      - name: Package
        run: |
          zip="Foxlume-Query-$VERSION-arm64.zip"
          ditto -c -k --keepParent "build/Foxlume Query.app" "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            scripts/release-notes.sh "$VERSION"
            echo
            echo "### Install"
            echo
            echo "Download \`$ZIP\`, unzip it and move **Foxlume Query.app** to Applications. The app is signed ad hoc"
            echo "(no Apple Developer ID), so macOS blocks the first launch of a downloaded copy. Clear the quarantine flag once:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "/Applications/Foxlume Query.app"'
            echo '```'
            echo
            echo "Requires macOS 13 or later on Apple silicon. Check the download with \`shasum -a 256 -c $ZIP.sha256\`."
          } > notes.md
          # Not marked as a pre-release, so /releases/latest (linked from the README and the website) finds it.
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "Foxlume Query $VERSION" --notes-file notes.md
