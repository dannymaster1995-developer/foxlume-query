name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macOS 26 ships Xcode 26 by default, close to the Swift 6.3 toolchain the project is developed with.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Cache DuckDB download
        uses: actions/cache@v4
        with:
          path: .build/duckdb-download
          key: duckdb-${{ hashFiles('scripts/fetch-duckdb.sh') }}

      - name: Fetch DuckDB
        run: scripts/fetch-duckdb.sh

      - name: Build
        run: |
          source scripts/env.sh
          fqswift build

      - name: Test
        # Live database suites skip themselves: no servers run on the CI machine.
        # One test at a time, like the QA gate: the runner has 3 cores, and in a parallel run tests that block on
        # sockets and processes hold the few shared threads, so time limits measure the other tests, not the app.
        run: |
          source scripts/env.sh
          fqtest --no-parallel
